<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00664F">
<title>Sale Inspector</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2300664F'/%3E%3Cpath d='M32 10c-9 0-16 7-16 16 0 12 16 28 16 28s16-16 16-28c0-9-7-16-16-16z' fill='%23fff'/%3E%3Ccircle cx='32' cy='26' r='6' fill='%2300664F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --sign: #00664F;          /* highway guide-sign green */
    --sign-ink: #ffffff;
    --panel: #ffffff;
    --ink: #1d2421;
    --muted: #56625c;
    --line: #d3dad6;
    --field: #f0f3f1;
    --good: #00664F;
    --bad: #b3261e;
    --parcel: #00e5ff;        /* same cyan as the DataLog aerials */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sign: #00785d;
      --panel: #18201d;
      --ink: #eef2f0;
      --muted: #a3b0aa;
      --line: #34413c;
      --field: #222c28;
      --good: #4fd1a5;
      --bad: #ff8a80;
      color-scheme: dark;
    }
  }
  html, body { height: 100%; margin: 0; }
  body { font-family: Barlow, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; color: var(--ink); background: var(--panel); }
  #map { position: fixed; inset: 0; background: #2b2f2d; }

  .bar {
    position: fixed; z-index: 1000;
    top: calc(env(safe-area-inset-top, 0px) + 10px); left: 10px; right: 10px;
    max-width: 640px; margin: 0 auto;
    display: flex; gap: 6px; padding: 6px;
    background: var(--panel); border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  select, input:not([type=radio]):not([type=checkbox]), button, .btn {
    font: inherit; min-height: 44px; box-sizing: border-box;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--field); color: var(--ink); padding: 0 10px;
  }
  .btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  #county { flex: 0 0 auto; max-width: 36%; }
  #pid { flex: 1 1 auto; min-width: 0; }
  .primary { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); font-weight: 600; }
  button:disabled { opacity: .6; }
  :focus-visible { outline: 3px solid var(--parcel); outline-offset: 2px; }

  .sheet {
    position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0;
    max-width: 640px; margin: 0 auto; max-height: 55vh; overflow-y: auto;
    background: var(--panel); border-radius: 16px 16px 0 0;
    box-shadow: 0 -2px 12px rgba(0,0,0,.35);
    padding: 4px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    box-sizing: border-box;
  }
  .clabel span { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; text-align: center;
    font: 700 15px/1.1 "Barlow Semi Condensed", Barlow, sans-serif; letter-spacing: .04em; text-transform: uppercase;
    color: #fff; text-shadow: 0 0 3px #000, 0 0 6px #000, 0 0 2px #000; pointer-events: none; }
  .clabel.off span { color: #c9c9c9; font-size: 13px; }
  .clabel small { display: block; font: 600 10px Barlow, sans-serif; letter-spacing: 0; text-transform: none; opacity: .9; }
  .hide-clabels .clabel { display: none; }
  .small-clabels .clabel span { font-size: 11px; letter-spacing: 0; }
  .small-clabels .clabel small { display: none; }
  .grab { display: block; width: 100%; min-height: 26px; padding: 8px 0 10px; margin: 0; border: 0; background: none; cursor: pointer; }
  .grab .grabbar { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--muted); opacity: .6; margin: 0 auto; }
  .head { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .verdict { font-weight: 600; margin-top: 2px; }
  .verdict.ok { color: var(--good); }
  .verdict.no { color: var(--bad); }
  .sheet:not(.collapsed) .verdict { display: none; }
  .sheet.collapsed #sheetBody, .sheet.collapsed .foot { display: none; }
  .sheet.collapsed .readout { font-size: 34px; }
  .sheet.collapsed .status:not(.err) { display: none; }
  .sale { font-weight: 600; color: var(--muted); font-size: 15px; min-height: 1em; }
  .readout {
    font-family: "Barlow Semi Condensed", Barlow, sans-serif; font-weight: 700;
    font-size: 46px; line-height: 1.05; margin: 2px 0 2px; letter-spacing: -.01em;
  }
  .readout.inside { color: var(--good); }
  .sub { color: var(--muted); line-height: 1.35; }
  details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 6px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .tapped { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--field); line-height: 1.4; }
  .tapped .ok { color: var(--good); font-weight: 600; }
  .tapped .no { color: var(--bad); font-weight: 600; }
  .tapped button { margin-top: 8px; }
  .actions { display: flex; gap: 6px; margin-top: 12px; }
  .actions > * { flex: 1 1 0; font-weight: 600; }
  .status { margin-top: 8px; font-size: 14px; color: var(--muted); min-height: 1.2em; }
.status.err { color: var(--bad); }
  .testlink { display: inline-block; margin-top: 6px; font-size: 14px; color: var(--muted); }
  .testpanel { position: fixed; inset: 0; z-index: 2000; overflow-y: auto; background: var(--panel); color: var(--ink);
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 14px calc(env(safe-area-inset-bottom, 0px) + 20px); box-sizing: border-box; }
  .testpanel h1 { font-family: "Barlow Semi Condensed", Barlow, sans-serif; font-size: 28px; margin: 0 0 4px; }
  .testpanel .summary { color: var(--muted); margin-bottom: 10px; }
  .testpanel .tbtns { display: flex; gap: 6px; margin-bottom: 12px; }
  .testpanel .tbtns > * { flex: 1 1 0; font-weight: 600; }
  .trow { display: grid; grid-template-columns: 4.2em 1fr; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .trow .st { font-weight: 700; }
  .trow .st.PASS { color: var(--good); }
  .trow .st.FAIL { color: var(--bad); }
  .trow .st.WARN { color: #c77700; }
  .trow .nm { font-weight: 600; }
  .trow .nt { grid-column: 2; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }

  .leaflet-top { top: calc(env(safe-area-inset-top, 0px) + 66px); }
  .leaflet-bottom { bottom: var(--sheet-h, 0px); }
  .leaflet-control-layers { font-family: inherit; }
  @media (prefers-reduced-motion: reduce) { .leaflet-zoom-anim .leaflet-zoom-animated { transition: none !important; } }
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<div class="bar">
  <select id="county" aria-label="County"></select>
  <input id="pid" placeholder="Parcel ID or record no." autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Parcel IDs, comma separated">
  <button id="find" class="primary">Find</button>
</div>

<section class="sheet" id="sheet">
  <button class="grab" id="grab" aria-expanded="true" aria-controls="sheetBody" aria-label="Hide details"><span class="grabbar"></span></button>
  <div class="head" id="sheetHead">
    <div class="sale" id="saleName"></div>
    <div class="readout" id="readout" aria-live="polite">Pick a parcel</div>
    <div class="verdict" id="verdict" hidden></div>
  </div>
  <div id="sheetBody">
  <div class="sub" id="sub">Enter a parcel ID above, or tap a field on the map.</div>
  <div class="tapped" id="tapped" hidden></div>
  <details id="details" hidden>
    <summary>Parcel details</summary>
    <dl id="facts"></dl>
  </details>
  <div class="actions">
    <button id="here">Parcel I’m in</button>
    <button id="center">Center on me</button>
    <a id="nav" class="btn" target="_blank" rel="noopener" aria-disabled="true">Directions</a>
  </div>
  </div>
  <div class="status" id="status"></div>
  <div class="foot"><a class="testlink" href="?test=1">Run county self-test</a> <span class="testlink">· v0.8</span></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------------------
// Sale Inspector v0.8 — shows where a sale parcel is relative to you.
// Parcel sources: District III (same as the DataLog builder), First District
// (northeast SD), and Minnehaha / Lincoln / Pennington county servers.
// ---------------------------------------------------------------------------
const D3 = "https://gis.districtiii.org/server/rest/services";
const FD = "https://www.1stdistrict.org/arcgis/rest/services";
const D3_COUNTIES = ["Aurora","Bennett","Bon Homme","Brule","Buffalo","Butte","Campbell","Charles Mix","Davison",
  "Day","Douglas","Faulk","Gregory","Haakon","Hanson","Hughes","Hutchinson","Jackson","Jerauld","Jones","Lyman",
  "Marshall","McPherson","Mellette","Potter","Sanborn","Stanley","Sully","Todd","Tripp","Turner","Ziebach"];
const FD_COUNTIES = ["Beadle","Clark","Codington","Deuel","Edmunds","Grant","Hamlin","Hand","Kingsbury",
  "Lawrence","Miner","Moody","Roberts"];
const SINGLE = {
  "Minnehaha": { src: "Minnehaha County GIS", url: "https://gis.minnehahacounty.gov/minnemap/rest/services/Parcels/MapServer",
                 fields: { id: "MRRDID", also: ["MAP_ID", "TAG"], owner: "MRTNM1", acres: "TOTAL_ACREAGE", legal: "LEGAL_DESC" } },
  "Lincoln": { src: "Lincoln County GIS", root: "https://gis.lincolncountysd.gov/arcgis/rest/services",
               url: "https://gis.lincolncountysd.gov/arcgis/rest/services/ParcelRelate/MapServer",
               fields: { id: "Parcel.PID", also: ["Parcel.Incode", "GIS_Parcels.Parcel_ID"], owner: "GIS_Parcels.Name",
                         legal: "Parcel.LegalDesc", acres: "GIS_Parcels.ReAcres" } },
  "Pennington": { src: "Pennington County GIS", root: "https://gis.rcgov.org/server/rest/services" }
};
const COUNTIES = [...D3_COUNTIES, ...FD_COUNTIES, ...Object.keys(SINGLE)].sort();
const ID_FIELDS = ["parcel_id","PARCELID","PARCEL","PARCELNO","PARCEL_NO","PARCELNUM","PARCEL_NUM","PARCEL_NUMBER",
  "PARCELNUMBER","PARCEL_NUMB","PARCELNUMB","PRCL_ID","PIN","PID","TAXID","TAX_ID","TAXPARCEL","TAX_PARCEL","GEOPIN",
  "RECORD","RECORD_NO","RECORDNO","RECNO"];
const LEGAL_FIELDS = ["LEGAL","LEGAL_DESC","LEGALDESC","LEGAL_DESCRIPTION","LEGALDESCR","LEGAL1"];
const ACRE_FIELDS = ["DEEDED_ACRE","DEEDED_ACRES","DEEDEDACRES","LEGAL_ACRE","LEGAL_ACRES","ACRES","DEED_ACRES","GIS_ACRES","CALC_ACRES"];
const OWNER_FIELDS = ["OWNER1","OWNER","OWNER_NAME","OWNERNAME","OWNER_1","OWN_NAME","NAME1","DEEDHOLDER","DEEDHOLD","DEED_HOLDER","CURRENT_OWNER","CURRENT_OW"];

const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------------- network: fetch, with JSONP fallback if CORS blocks it ----------------
let transport = "fetch";
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "_cb" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const timer = setTimeout(() => { done(); reject(new Error("County GIS did not answer (timed out).")); }, 25000);
    function done() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error("County GIS request was blocked.")); };
    s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
    document.head.appendChild(s);
  });
}
async function arc(url, params = {}) {
  const full = url + "?" + new URLSearchParams({ ...params, f: "json" });
  let data;
  if (transport === "fetch") {
    try {
      const r = await fetch(full);
      data = await r.json();
    } catch (e) {
      transport = "jsonp";                 // CORS or network refusal: try the script-tag route
      data = await jsonp(full);
    }
  } else {
    data = await jsonp(full);
  }
  if (data && data.error) throw new Error("County GIS error: " + (data.error.message || "unknown"));
  return data;
}

// ---------------- county discovery (mirrors the Python builder) ----------------
const baseName = f => String(f).split(".").pop();
const SYSTEM_FIELD = /^(objectid|fid|oid|globalid|shape|shape_?(area|length|leng)|st_area|st_length)/i;
function pick(fields, cands) {
  const low = {};
  for (const f of fields) {                          // first field wins for a given bare name
    const k = baseName(f).toLowerCase();
    if (!(k in low)) low[k] = f;
  }
  for (const c of cands) if (low[c.toLowerCase()]) return low[c.toLowerCase()];
  return null;
}
function sourceOf(county) {
  if (D3_COUNTIES.includes(county)) return "d3";
  if (FD_COUNTIES.includes(county)) return "fd";
  if (SINGLE[county]) return "single";
  return null;
}

// Pick the parcel polygon layer out of a service's layer list (skips group layers, lines, labels, sales).
function parcelLayerId(layers, county) {
  const ok = (layers || []).filter(l =>
    /parcel|ownership|cadastr/i.test(l.name) && !/sale|plat|label|anno|point|text|line|dimension|lot ?line|hook/i.test(l.name) &&
    !(l.subLayerIds && l.subLayerIds.length) &&
    (!l.geometryType || /polygon/i.test(l.geometryType)));
  const nm = l => l.name.trim().toLowerCase().replace(/[_\s]+/g, " ");
  const best = ok.find(l => nm(l) === "parcels" || nm(l) === "parcel")
            || ok.find(l => nm(l).startsWith(county.toLowerCase()) && /parcel/.test(nm(l)))
            || ok.find(l => /parcel/.test(nm(l)))
            || ok[0];
  return best ? best.id : null;
}
const layerNames = layers => (layers || []).map(l => l.name).join(", ") || "(none)";

// Fallback field matching when the exact-name lists miss.
function fuzzy(fields, re, not) {
  return fields.find(f => { const b = baseName(f); return !SYSTEM_FIELD.test(b) && re.test(b) && !(not && not.test(b)); }) || null;
}
const NOT_OWNER = /addr|stre|city|state|_st$|zip|occ|add_?l|type|school|sub|twp|town|road|street|file|mail|code|date|bk|pg|book|page|ownership|2$/i;

async function layerCfg(svcUrl, id, src, county, over = {}) {
  const layer = `${svcUrl}/${id}`;
  const info = await arc(layer);
  const fdef = info.fields || [];
  const fields = fdef.map(f => f.name);
  if (!fields.length) throw new Error(`layer "${info.name}" has no readable fields`);
  const type = Object.fromEntries(fdef.map(f => [f.name, f.type]));
  const has = f => f && fields.includes(f) ? f : null;
  const isNum = f => /Integer|Double|Single|OID/.test(type[f] || "");
  // ID: first candidate field that actually holds values (Butte has an empty parcel_id)
  let idCands = over.id ? [has(over.id)].filter(Boolean) : [];
  if (!idCands.length) idCands = [...new Set(ID_FIELDS.map(c => pick(fields, [c])).filter(Boolean))];
  if (!idCands.length) { const fz = fuzzy(fields, /parcel|pin$|record/i, /area|length|acre|sale|plat|link|url|date/i); if (fz) idCands = [fz]; }
  if (!idCands.length) throw new Error(`${county}: layer "${info.name}" has no parcel ID field. Fields: ${fields.join(", ")}`);
  let idf = idCands[0];
  if (idCands.length > 1) {
    try {
      const s = await arc(layer + "/query", { where: "1=1", outFields: idCands.join(","), returnGeometry: false, resultRecordCount: 25 });
      const feats = (s.features || []).slice(0, 200);
      const filled = f => feats.filter(ft => { const v = String(ft.attributes[f] ?? "").trim(); return v && !/^0*$/.test(v); }).length;
      idf = idCands.reduce((best, f) => filled(f) > filled(best) ? f : best, idCands[0]);
    } catch (e) { /* keep first candidate */ }
  }
  const also = (over.also || []).map(has).filter(Boolean).map(f => ({ f, numeric: isNum(f) }));
  const acres = has(over.acres) || pick(fields, ACRE_FIELDS)
    || fuzzy(fields, /deed.*ac|legal.*ac/i) || fuzzy(fields, /acre|^ac$|_ac$|acres?_/i, /till|crop|pct|percent/i);
  return {
    v: 6, src, layer, layerName: info.name, fields,
    id: idf, idNumeric: isNum(idf), also,
    alt: idf === "RECORD" ? pick(fields, ["RECORD_1"]) : null,      // First District keeps a numeric copy
    legal: has(over.legal) || pick(fields, LEGAL_FIELDS) || fuzzy(fields, /legal|descr/i, /acre|_ac$|date|code/i),
    acres,
    owner: has(over.owner) || pick(fields, OWNER_FIELDS) || fuzzy(fields, /owner|own_?nam|ownnam|taxpayer|grantee|deedhold/i, NOT_OWNER)
  };
}

// Try each candidate service; return the first parcel layer that configures. Errors say what was seen.
async function firstParcelLayer(services, county, src) {
  const seen = [];
  for (const { url, label } of services) {
    let meta;
    try { meta = await arc(url); } catch (e) { seen.push(`${label}: ${e.message}`); continue; }
    const id = parcelLayerId(meta.layers, county);
    if (id === null) { seen.push(`${label} [${layerNames(meta.layers)}]`); continue; }
    try { return await layerCfg(url, id, src, county); }
    catch (e) { seen.push(`${label}: ${e.message}`); }
  }
  throw new Error(`No parcel layer found for ${county} on ${src}. Checked: ${seen.join(" | ") || "no matching services"}`);
}

let d3Root = null;
async function discoverD3(name) {
  const tag = (name === "Tripp" || name === "Todd") ? "TRIPP_TODD" : name.toUpperCase().replace(/ /g, "_");
  if (!d3Root) d3Root = arc(D3).catch(e => { d3Root = null; throw e; });
  const root = await d3Root;
  let svcs = [...(root.services || [])];
  // county services may also sit in a folder named for the county
  for (const f of (root.folders || []).filter(f => f.toUpperCase().replace(/ /g, "_").includes(tag))) {
    try { svcs.push(...((await arc(`${D3}/${f}`)).services || [])); } catch (e) {}
  }
  const mine = svcs.filter(s => {
    const n = s.name.toUpperCase().split("/").pop();
    return /MapServer|FeatureServer/.test(s.type) && (n.startsWith(tag + "_") || n === tag)
      && !/FSA|LOCATOR|IMAGE|ORTHO|NAIP|GEOCOD/.test(n);
  });
  const score = n => (/LAYERS/i.test(n) ? 0 : 2) + (/WEB/i.test(n) ? 0 : 1);
  const yr = n => parseInt(n.slice(-2).replace(/\D/g, "") || "0", 10);
  mine.sort((a, b) => score(a.name) - score(b.name) || yr(b.name) - yr(a.name) || (a.type === "MapServer" ? 0 : 1) - (b.type === "MapServer" ? 0 : 1));
  if (!mine.length) throw new Error(`No ${tag}_ services on District III.`);
  return firstParcelLayer(mine.map(s => ({ url: `${D3}/${s.name}/${s.type}`, label: s.name })), name, "District III GIS");
}

async function discoverFD(name) {
  const folder = await arc(`${FD}/${encodeURIComponent(name)}`);
  const svcs = (folder.services || []).filter(s => /FeatureServer|MapServer/.test(s.type));
  svcs.sort((a, b) => (/mapnet/i.test(a.name) ? 0 : 1) - (/mapnet/i.test(b.name) ? 0 : 1)
                   || (a.type === "FeatureServer" ? 0 : 1) - (b.type === "FeatureServer" ? 0 : 1));
  return firstParcelLayer(svcs.map(s => ({ url: `${FD}/${s.name}/${s.type}`, label: s.name })), name, "First District GIS");
}

// Whole county server: scan its services (and folders) for a parcel layer.
async function scanServer(root, county, src) {
  const top = await arc(root);
  let svcs = [...(top.services || [])];
  for (const f of (top.folders || []).slice(0, 20)) {
    if (/^(utilities|system|basemaps?|hosted|imagery|elevation|locators?|geocod|printing|test)/i.test(f)) continue;
    try { svcs.push(...((await arc(`${root}/${f}`)).services || [])); } catch (e) {}
  }
  svcs = svcs.filter(s => /MapServer|FeatureServer/.test(s.type) && !/locator|geocod|imagery|ortho|aerial|print/i.test(s.name));
  const score = n => /parcel/i.test(n) ? 0 : /tax|propert|owner|cadast|assess|equaliz|land/i.test(n) ? 1 : /public|county|web|general|map|base/i.test(n) ? 2 : 3;
  svcs.sort((a, b) => score(a.name) - score(b.name));
  return firstParcelLayer(svcs.slice(0, 25).map(s => ({ url: `${root}/${s.name}/${s.type}`, label: s.name })), county, src);
}

async function discoverSingle(name) {
  const { url, root, src, fields } = SINGLE[name];
  if (url) {
    const meta = await arc(url);
    const id = parcelLayerId(meta.layers, name);
    if (id !== null) return await layerCfg(url, id, src, name, fields || {});
    if (!root) throw new Error(`No parcel layer on ${src}. Layers: ${layerNames(meta.layers)}`);
  }
  return scanServer(root, name, src);
}

async function countyCfg(name, fresh = false) {
  const key = "si.cfg6." + name;
  if (!fresh) { try { const c = JSON.parse(localStorage.getItem(key)); if (c && c.v === 6) return c; } catch (e) {} }
  const src = sourceOf(name);
  const cfg = src === "d3" ? await discoverD3(name) : src === "fd" ? await discoverFD(name) : await discoverSingle(name);
  try { localStorage.setItem(key, JSON.stringify(cfg)); } catch (e) {}
  return cfg;
}

const normId = t => String(t ?? "").trim().replace(/^0+(?=\d)/, "").toUpperCase();

function toParcels(cfg, data) {
  const out = [], seen = new Set();
  for (const ft of (data.features || [])) {
    const a = ft.attributes || {};

const LABEL_AT = Object.fromEntries(SD_COUNTIES_COARSE.map(c => [c.n, c.l]));
let countyShapes = [], countyDetail = false;

function setCountyShapes(list, detailed) {
  countyShapes = list.map(c => {
    let x0 = 180, y0 = 90, x1 = -180, y1 = -90;
    for (const r of c.rings) for (const [x, y] of r) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return { name: c.name, rings: c.rings, bb: [x0, y0, x1, y1], label: LABEL_AT[c.name] || [(x0 + x1) / 2, (y0 + y1) / 2] };
  });
  countyDetail = detailed;
  countyLines.clearLayers(); countyLabels.clearLayers();
  for (const c of countyShapes) {
    const ll = c.rings.map(r => r.map(([x, y]) => [y, x]));
    L.polygon(ll, { color: "#000", weight: 4, opacity: .35, fill: false, interactive: false }).addTo(countyLines);
    L.polygon(ll, { color: "#fff", weight: 1.6, opacity: .9, dashArray: "7 5", fill: false, interactive: false }).addTo(countyLines);
    const ok = COUNTIES.includes(c.name);
    L.marker([c.label[1], c.label[0]], { interactive: false, keyboard: false,
      icon: L.divIcon({ className: "clabel" + (ok ? "" : " off"), iconSize: null,
        html: `<span>${esc(c.name)}${ok ? "" : "<small>no parcel data</small>"}</span>` }) }).addTo(countyLabels);
  }
}
setCountyShapes(SD_COUNTIES_COARSE.map(c => ({ name: c.n, rings: c.r })), false);

// labels only when zoomed out far enough to need them
function updateCountyLabels() {
  const z = map.getZoom();
  map.getContainer().classList.toggle("hide-clabels", z < 7 || z > 12);
  map.getContainer().classList.toggle("small-clabels", z < 9);
}
map.on("zoomend", updateCountyLabels);

async function loadCountyDetail() {
  const KEY = "si.counties.v1";
  try {
    const c = JSON.parse(localStorage.getItem(KEY));
    if (c && c.list && c.list.length >= 60 && Date.now() - c.t < 180 * 864e5) { setCountyShapes(c.list, true); return; }
  } catch (e) {}
  try {
    const svc = "https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer";
    const meta = await arc(svc);
    const lyr = (meta.layers || []).find(l => /^counties$/i.test(l.name.trim()) && !(l.subLayerIds && l.subLayerIds.length));
    if (!lyr) return;
    const d = await arc(`${svc}/${lyr.id}/query`, { where: "STATE='46'", outFields: "BASENAME,NAME",
      returnGeometry: true, outSR: 4326, maxAllowableOffset: 0.0002, geometryPrecision: 5 });
    const list = (d.features || []).filter(f => f.geometry && f.geometry.rings)
      .map(f => ({ name: String(f.attributes.BASENAME || f.attributes.NAME || "").replace(/ County$/, "").trim(), rings: f.geometry.rings }));
    if (list.length < 60) return;
    setCountyShapes(list, true);
    try { localStorage.setItem(KEY, JSON.stringify({ t: Date.now(), list })); } catch (e) {}
  } catch (e) { /* built-in outlines stay in use */ }
}

function countyAt(lat, lng) {
  for (const c of countyShapes) {
    const [x0, y0, x1, y1] = c.bb;
    if (lng < x0 || lng > x1 || lat < y0 || lat > y1) continue;
    if (relation({ lat, lng }, [c]).inside) return c.name;
  }
  return null;
}
// The county the point is in, then any county whose line is close (the outlines are generalized).
function countyCandidates(lat, lng) {
  const buf = countyDetail ? 400 : 3000;                       // metres
  const dLat = buf / 110540, dLng = buf / (111320 * Math.cos(lat * Math.PI / 180));
  const near = [];
  for (const c of countyShapes) {
    const [x0, y0, x1, y1] = c.bb;
    if (lng < x0 - dLng || lng > x1 + dLng || lat < y0 - dLat || lat > y1 + dLat) continue;
    const r = relation({ lat, lng }, [c]);
    if (r.inside) near.push({ name: c.name, d: -1 });
    else if (r.dist <= buf) near.push({ name: c.name, d: r.dist });
  }
  return near.sort((a, b) => a.d - b.d).map(n => n.name);
}
const SALE_STYLE = { color: "#00e5ff", weight: 4, fillColor: "#00e5ff", fillOpacity: 0.12, interactive: false };
const TAP_STYLE = { color: "#ffffff", weight: 3, dashArray: "8 6", fillColor: "#ffffff", fillOpacity: 0.08, interactive: false };

function latlngs(p) { return p.rings.map(r => r.map(([x, y]) => [y, x])); }
function drawParcels(layer, parcels, style) {
  layer.clearLayers();
  for (const p of parcels) {
    L.polygon(latlngs(p), { color: "#000", weight: style.weight + 3, fill: false, opacity: .6, interactive: false }).addTo(layer);
    L.polygon(latlngs(p), style).addTo(layer);
  }
}
function boundsOf(parcels) { return L.latLngBounds(parcels.flatMap(p => p.rings.flat().map(([x, y]) => [y, x]))); }

// ---------------- geometry: where is the parcel relative to me ----------------
function compass(dx, dy) {
  const a = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
  return ["N","NE","E","SE","S","SW","W","NW"][Math.round(a / 45) % 8];
}
function relation(pos, parcels) {
  const kx = 111320 * Math.cos(pos.lat * Math.PI / 180), ky = 110540;
  const P = ([x, y]) => [(x - pos.lng) * kx, (y - pos.lat) * ky];      // metres, me at origin
  let inside = false, best = Infinity, bp = [0, 0];
  for (const p of parcels) for (const ring of p.rings) {
    const pts = ring.map(P);
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      if ((a[1] > 0) !== (b[1] > 0)) {
        const xi = a[0] + (0 - a[1]) * (b[0] - a[0]) / (b[1] - a[1]);
        if (xi > 0) inside = !inside;
      }
      const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
      const t = L2 ? Math.max(0, Math.min(1, -(a[0] * dx + a[1] * dy) / L2)) : 0;
      const cx = a[0] + t * dx, cy = a[1] + t * dy, d = Math.hypot(cx, cy);
      if (d < best) { best = d; bp = [cx, cy]; }
    }
  }
  return { inside, dist: best, dir: compass(bp[0], bp[1]), pt: [pos.lat + bp[1] / ky, pos.lng + bp[0] / kx] };
}
function fmtDist(m) {
  const mi = m / 1609.344;
  if (mi < 0.1) return `${Math.round(m * 3.28084 / 10) * 10} ft`;
  return `${mi < 10 ? mi.toFixed(2) : mi.toFixed(1)} mi`;
}

// ---------------- rendering ----------------
function setStatus(t, err = false) { const s = $("status"); s.textContent = t; s.classList.toggle("err", err); }
function gpsLine() {
  const bits = [];
  if (me) bits.push(`GPS ±${fmtDist(me.acc)}`);
  if (me) { const cn = countyAt(me.lat, me.lng); if (cn) bits.push(`in ${cn} Co.`); }
  if (transport === "jsonp") bits.push("county GIS via fallback route");
  return bits.join(", ");
}

function renderFacts() {
  const d = $("details");
  if (!sale.length) { d.hidden = true; return; }
  const acres = sale.reduce((t, p) => t + (p.acres || 0), 0);
  const owners = [...new Set(sale.map(p => p.owner).filter(Boolean))];
  const legals = sale.map(p => p.legal).filter(Boolean);
  const rows = [["Parcel", sale.map(p => p.id).join(", ")]];
  if (acres) rows.push(["Acres", acres.toLocaleString(undefined, { maximumFractionDigits: 2 })]);
  if (owners.length) rows.push(["Owner", owners.join("; ")]);
  if (legals.length) rows.push(["Legal", legals.join("; ")]);
  rows.push(["Source", [...new Set(sale.map(p => p.src).filter(Boolean))].join(", ")]);
  $("facts").innerHTML = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  d.hidden = false;
}

function update() {
  lineLayer.clearLayers();

  ro.classList.remove("inside");
  $("saleName").textContent = sale.length ? (saleLabel || sale.map(p => p.id).join(", ")) : "";

    const c = boundsOf(sale).getCenter();
    nav.href = `https://www.google.com/maps/dir/?api=1&destination=${c.lat.toFixed(6)},${c.lng.toFixed(6)}`;

  if (!sale.length) {
    ro.textContent = "Pick a parcel";
    sub.textContent = "Enter a parcel ID above, or tap a field on the map.";
  } else if (!me) {
    ro.textContent = "Finding you…";
    sub.textContent = gpsMsg || "Allow location when the browser asks.";
  } else {
    const r = relation(me, sale);
    let note = "";
    if (r.inside) {
      ro.textContent = "You’re on it";
      ro.classList.add("inside");
      note = `Inside the sale parcel, ${fmtDist(r.dist)} from the nearest line.`;
    } else {
      ro.textContent = `${fmtDist(r.dist)} ${r.dir}`;
      note = "To the nearest line of the sale parcel.";
      L.polyline([[me.lat, me.lng], r.pt], { color: "#00e5ff", weight: 3, dashArray: "4 8", interactive: false }).addTo(lineLayer);
    }
    if (me.acc && r.dist < me.acc) note += ` That’s within GPS error (±${fmtDist(me.acc)}), so check the line by eye.`;
    sub.textContent = note;
  }
  if (!$("status").classList.contains("err")) setStatus(gpsLine());
}

function showTapped(p, fromMe) {
  const box = $("tapped");
  const vd = $("verdict");
  if (!p) { box.hidden = true; vd.hidden = true; tapLayer.clearLayers(); return; }
  drawParcels(tapLayer, [p], TAP_STYLE);
  const isSale = sale.some(s => s.id === p.id);
  const lead = fromMe ? "You’re standing in" : "Tapped";
  const meta = [p.owner, p.acres ? `${p.acres} ac` : ""].filter(Boolean).join(", ");
  box.innerHTML = `${lead} <b>${esc(p.id)}</b>: `
    + (isSale ? `<span class="ok">this is the sale parcel.</span>` : `<span class="no">not the sale parcel.</span>`)
    + (meta ? `<br>${esc(meta)}` : "")
    + (p.legal ? `<br>${esc(p.legal)}` : "")
    + (isSale ? "" : `<br><button id="useTapped">Inspect this parcel instead</button>`);
  box.hidden = false;
  vd.textContent = isSale ? `✓ ${fromMe ? "You’re in" : "Tapped"} the sale parcel` : `✗ ${fromMe ? "You’re in" : "Tapped"} ${p.id}, not the sale parcel`;
  vd.className = "verdict " + (isSale ? "ok" : "no");
  vd.hidden = false;
  const btn = $("useTapped");
  if (btn) btn.onclick = () => { setSale([p], ""); showTapped(null); };
}

function setSale(parcels, label) {
  sale = parcels;
  saleLabel = label || "";
  $("pid").value = parcels.map(p => p.id).join(", ");
  drawParcels(saleLayer, sale, SALE_STYLE);
  const b = boundsOf(sale);
  if (me && map.distance([me.lat, me.lng], b.getCenter()) < 8000) b.extend([me.lat, me.lng]);
  fit(b);
  update();
}

// ---------------- actions ----------------
async function findSale(label) {
  const county = $("county").value;
  const ids = $("pid").value.split(/[,;]/).map(t => t.trim()).filter(Boolean);
  if (!ids.length) { setStatus("Enter a parcel ID first.", true); return; }
  const btn = $("find");
  btn.disabled = true; btn.textContent = "Finding…";
  setStatus(`Looking up ${ids.length > 1 ? "parcels" : "parcel"} in ${county} County…`);
  try {
    const cfg = await countyCfg(county);
    const found = await parcelsByIds(cfg, ids);
    if (!found.length) throw new Error(`No parcel ${ids.join(", ")} in ${county} County. Check the ID and the county.`);
    showTapped(null);
    setStatus("");
    setSale(found, label);
    const missing = ids.filter(i => !found.some(p => (p.keys || [normId(p.id)]).includes(normId(i))));
    if (missing.length) setStatus(`Not found in ${county} County: ${missing.join(", ")}`, true);
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = "Find";
  }
}

async function identify(lat, lng, fromMe) {
  const cands = countyCandidates(lat, lng);
  const usable = cands.filter(n => COUNTIES.includes(n));
  if (cands.length && !usable.length) { setStatus(`${cands[0]} County parcels aren’t available in this app.`, true); return; }
  const order = usable.length ? usable.slice(0, 3) : [sel.value];
  setStatus(`Checking ${order[0]} County parcels…`);
  try {
    for (const county of order) {
      const cfg = await countyCfg(county);
      const found = await parcelAt(cfg, lat, lng);
      if (!found.length) continue;
      if (sel.value !== county) { sel.value = county; try { localStorage.setItem("si.county", county); } catch (e) {} }
      setStatus("");
      if (!sale.length) setSale([found[0]], "");
      else showTapped(found[0], fromMe);
      update();
      return;
    }
    setStatus(`No parcel at that spot (checked ${order.join(", ")}).`, true);
  } catch (e) {
    setStatus(e.message, true);
  }
}

// ---------------- GPS ----------------
function onPosition(pos) {
  me = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
  gpsMsg = "";
  const ll = [me.lat, me.lng];
  if (!meDot) {
    meRing = L.circle(ll, { radius: me.acc, color: "#2f80ff", weight: 1, fillOpacity: .12, interactive: false }).addTo(map);
    meDot = L.circleMarker(ll, { radius: 8, color: "#fff", weight: 3, fillColor: "#2f80ff", fillOpacity: 1, interactive: false }).addTo(map);
  } else { meDot.setLatLng(ll); meRing.setLatLng(ll).setRadius(me.acc); }
  if (!centeredOnce && !sale.length) { map.setView(ll, 16); centeredOnce = true; }
  if (!sale.length && !countyPicked) {
    const cn = countyAt(me.lat, me.lng);
    if (cn && COUNTIES.includes(cn) && sel.value !== cn) { sel.value = cn; try { localStorage.setItem("si.county", cn); } catch (e) {} }
  }
  if (!$("status").classList.contains("err")) setStatus(gpsLine());
  update();
}
function onGpsError(err) {
  gpsMsg = err.code === 1
    ? "Location is blocked for this page. Turn it on in the browser’s site settings, then reload."
    : err.code === 3 ? "Still waiting on GPS. Open sky helps."
    : "Location is unavailable right now.";
  update();
}
if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(onPosition, onGpsError, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
} else {
  gpsMsg = "This browser can’t share location.";
}

// ---------------- wiring ----------------
const sel = $("county");
sel.innerHTML = COUNTIES.map(c => `<option>${esc(c)}</option>`).join("");
try { sel.value = localStorage.getItem("si.county") || "Turner"; } catch (e) { sel.value = "Turner"; }
sel.onchange = () => { countyPicked = true; try { localStorage.setItem("si.county", sel.value); } catch (e) {} };

function setCollapsed(c) {
  sheet.classList.toggle("collapsed", c);
  const g = $("grab");
  g.setAttribute("aria-expanded", String(!c));
  g.setAttribute("aria-label", c ? "Show details" : "Hide details");
  try { localStorage.setItem("si.collapsed", c ? "1" : "0"); } catch (e) {}
}
let swipedAt = 0;
const toggleSheet = () => { if (Date.now() - swipedAt > 400) setCollapsed(!sheet.classList.contains("collapsed")); };
for (const el of [$("grab"), $("sheetHead")]) {
  el.addEventListener("click", toggleSheet);
  let y0 = null;
  el.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener("touchend", e => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0;
    y0 = null;
    if (Math.abs(dy) > 40) { setCollapsed(dy > 0); swipedAt = Date.now(); }
  }, { passive: true });
}
try { setCollapsed(localStorage.getItem("si.collapsed") === "1"); } catch (e) {}

$("find").onclick = () => findSale("");
$("pid").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); findSale(""); } });
$("here").onclick = () => me ? identify(me.lat, me.lng, true) : setStatus("No GPS fix yet.", true);
$("center").onclick = () => me ? map.setView([me.lat, me.lng], Math.max(map.getZoom(), 16)) : setStatus("No GPS fix yet.", true);
map.on("click", e => identify(e.latlng.lat, e.latlng.lng, false));

// Links like ?county=Turner&pid=15000-09755-161-04&label=Haffner%20to%20Neuharth open straight to a sale
const q = new URLSearchParams(location.search);
if (q.get("county")) {
  const c = COUNTIES.find(n => n.toLowerCase() === q.get("county").trim().toLowerCase());
  if (c) { sel.value = c; countyPicked = true; }
}
if (q.get("pid")) { $("pid").value = q.get("pid"); findSale(q.get("label") || ""); }
// ---------------- county self-test (?test=1) ----------------
// For each county: discover the parcel layer, pull a sample parcel, look it up
// again by its ID, then check a tap at its centre finds the same parcel.
async function sampleParcel(cfg) {
  let ps = [];
  try {
    ps = toParcels(cfg, await arc(cfg.layer + "/query",
      { where: "1=1", outFields: "*", returnGeometry: true, outSR: 4326, resultRecordCount: 10 }));
  } catch (e) { ps = []; }
  if (!ps.length) {
    const ids = await arc(cfg.layer + "/query", { where: "1=1", returnIdsOnly: true });
    const oids = (ids.objectIds || []).slice(0, 25);
    if (!oids.length) throw new Error("parcel layer returned no features");
    ps = toParcels(cfg, await arc(cfg.layer + "/query",
      { objectIds: oids.join(","), outFields: "*", returnGeometry: true, outSR: 4326 }));
  }
  if (!ps.length) throw new Error(`sample parcels have no value in ID field ${cfg.id}. Fields: ${(cfg.fields || []).join(", ")}`);
  // prefer a real-looking parcel: non-zero ID, has an owner
  return ps.find(p => !/^0*$/.test(p.id) && p.owner) || ps.find(p => !/^0*$/.test(p.id)) || ps[0];
}

function interiorPoint(p) {
  const b = boundsOf([p]);
  const c = b.getCenter();
  if (relation({ lat: c.lat, lng: c.lng }, [p]).inside) return { lat: c.lat, lng: c.lng };
  for (let i = 1; i < 8; i++) for (let j = 1; j < 8; j++) {
    const pt = { lat: b.getSouth() + (b.getNorth() - b.getSouth()) * i / 8, lng: b.getWest() + (b.getEast() - b.getWest()) * j / 8 };
    if (relation(pt, [p]).inside) return pt;
  }
  return null;
}

async function testCounty(name) {
  const r = { county: name, src: "", status: "FAIL", notes: [], ms: 0 };
  const t0 = performance.now();
  try {
    const cfg = await countyCfg(name, true);
    r.src = cfg.src;
    r.layer = `${cfg.layer.replace(/^https?:\/\/[^/]+/, "")} "${cfg.layerName}", ID ${cfg.id}`;
    const warn = [];
    const p = await sampleParcel(cfg);
    const byId = await parcelsByIds(cfg, [p.id]);
    if (!byId.some(x => normId(x.id) === normId(p.id))) throw new Error(`lookup by ID ${p.id} found nothing (field ${cfg.id})`);
    const pt = interiorPoint(p);
    if (pt) {
      const at = await parcelAt(cfg, pt.lat, pt.lng);
      if (!at.length) warn.push("tap lookup found nothing");
      else if (!at.some(x => x.id === p.id)) warn.push(`tap lookup returned ${at[0].id}, not ${p.id}`);
    }
    const missing = ["owner", "legal", "acres"].filter(k => !cfg[k]);
    if (missing.length) warn.push(`no ${missing.join("/")} field. Fields: ${(cfg.fields || []).join(", ")}`);
    r.notes.push(`layer "${cfg.layerName}", ID ${cfg.id}, sample ${p.id}` + (p.owner ? `, owner ${p.owner}` : "")
      + `; owner=${cfg.owner || "-"} legal=${cfg.legal || "-"} acres=${cfg.acres || "-"}`, ...warn);
    r.status = warn.length ? "WARN" : "PASS";
  } catch (e) {
    r.notes.push((e.message || String(e)) + (r.layer ? ` [layer ${r.layer}]` : ""));
  }
  r.ms = Math.round(performance.now() - t0);
  return r;
}

async function runSelfTest() {
  const panel = document.createElement("section");
  panel.className = "testpanel";
  panel.innerHTML = `<h1>County self-test <small style="font-size:16px;color:var(--muted)">v0.8</small></h1><div class="summary" id="tsum">Starting…</div>
    <div class="tbtns"><button id="tcopy" class="primary" disabled>Copy results</button><a class="btn" href="./">Close</a></div>
    <div id="trows"></div>`;
  document.body.appendChild(panel);
  const rows = {};
  for (const c of COUNTIES) {
    const d = document.createElement("div");
    d.className = "trow";
    d.innerHTML = `<span class="st">…</span><span class="nm">${esc(c)}</span><span class="nt"></span>`;
    $("trows").appendChild(d);
    rows[c] = d;
  }
  const results = [], queue = [...COUNTIES];
  const tally = () => {
    const n = k => results.filter(r => r.status === k).length;
    $("tsum").textContent = `${results.length} of ${COUNTIES.length} done: ${n("PASS")} pass, ${n("WARN")} warn, ${n("FAIL")} fail`
      + (transport === "jsonp" ? " (fallback route in use)" : "");
  };
  async function worker() {
    while (queue.length) {
      const c = queue.shift();
      rows[c].querySelector(".st").textContent = "…";
      const r = await testCounty(c);
      results.push(r);
      const st = rows[c].querySelector(".st");
      st.textContent = r.status; st.className = "st " + r.status;
      rows[c].querySelector(".nm").textContent = `${c}` + (r.src ? ` (${r.src})` : "");
      rows[c].querySelector(".nt").textContent = r.notes.join("; ") + `  [${(r.ms / 1000).toFixed(1)} s]`;
      tally();
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  // failures first in the copied text
  const order = { FAIL: 0, WARN: 1, PASS: 2 };
  const text = `Sale Inspector v0.8 self-test ${new Date().toLocaleString()}\n${$("tsum").textContent}\n\n`
    + results.sort((a, b) => order[a.status] - order[b.status] || a.county.localeCompare(b.county))
        .map(r => `${r.status.padEnd(4)}  ${r.county}${r.src ? " (" + r.src + ")" : ""}: ${r.notes.join("; ")}`).join("\n");
  const btn = $("tcopy");
  btn.disabled = false;
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.cssText = "width:100%;height:40vh;margin-top:10px";
      panel.insertBefore(ta, $("trows")); ta.select();
      btn.textContent = "Select all and copy below";
    }
  };
}

if (q.get("test")) runSelfTest();
loadCountyDetail();
update();
</script>
